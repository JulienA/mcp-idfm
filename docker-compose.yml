services:
  mcp-idfm:
    build: .
    ports:
      - "4000:${PORT:-3000}"
    environment:
      PRIM_API_KEY: ${PRIM_API_KEY:?PRIM_API_KEY is required}
      HOST: ${HOST:-localhost}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-11}
    restart: unless-stopped
