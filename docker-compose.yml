services:
  mcp-idfm:
    build: .
    ports:
      - "4000:${PORT:-3000}"
    environment:
      PRIM_API_KEY: ${PRIM_API_KEY:?PRIM_API_KEY is required}
      HOST: ${HOST:-localhost}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-11}
      MAX_PASSAGES_PER_GROUP: ${MAX_PASSAGES_PER_GROUP:-5}
      MAX_PASSAGES: ${MAX_PASSAGES:-30}
      PRIM_FETCH_TIMEOUT_MS: ${PRIM_FETCH_TIMEOUT_MS:-50000}
    restart: unless-stopped
